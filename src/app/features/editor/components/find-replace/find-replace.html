<div class="find-replace-bar" (keydown)="onKeyDown($event)">
  <!-- Search Row -->
  <div class="find-row">
    <div class="input-with-actions">
      <md-icon name="search" [size]="14" className="search-icon" />
      <input
        type="text"
        class="fr-input"
        placeholder="Find in document..."
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        autofocus
      />
      <button
        class="fr-icon-btn toggle-case"
        [class.active]="caseSensitive()"
        (click)="toggleCaseSensitive()"
        title="Match Case (Aa)"
      >
        <span>Aa</span>
      </button>
    </div>

    <!-- Match counter -->
    <div class="match-count">
      @if (searchQuery()) {
        <span>{{ totalMatches() > 0 ? (currentMatch() + 1) + ' of ' + totalMatches() : 'No matches' }}</span>
      }
    </div>

    <!-- Stepper arrows -->
    <div class="stepper-buttons">
      <button class="fr-icon-btn" (click)="findPrevious.emit()" title="Previous match (Shift+Enter)">
        <md-icon name="chevron-up" [size]="14" />
      </button>
      <button class="fr-icon-btn" (click)="findNext.emit()" title="Next match (Enter)">
        <md-icon name="chevron-down" [size]="14" />
      </button>
    </div>

    <!-- Close button -->
    <button class="fr-icon-btn close-btn" (click)="close.emit()" title="Close (Escape)">
      <md-icon name="close" [size]="14" />
    </button>
  </div>

  <!-- Replace Row -->
  <div class="replace-row">
    <div class="input-with-actions">
      <md-icon name="edit" [size]="14" className="replace-icon" />
      <input
        type="text"
        class="fr-input"
        placeholder="Replace with..."
        [value]="replaceQuery()"
        (input)="replaceQuery.set($any($event.target).value)"
      />
    </div>

    <div class="replace-actions">
      <button class="fr-btn" (click)="onReplace()" [disabled]="!searchQuery() || totalMatches() === 0">
        Replace
      </button>
      <button class="fr-btn" (click)="onReplaceAll()" [disabled]="!searchQuery() || totalMatches() === 0">
        Replace All
      </button>
    </div>
  </div>
</div>
