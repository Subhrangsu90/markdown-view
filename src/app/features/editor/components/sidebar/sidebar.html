<aside class="sidebar" [class.open]="isOpen()">
  <!-- Sidebar Header -->
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      <span class="brand-text">MarkdownView</span>
    </div>
    <button class="mobile-close-btn" (click)="toggleSidebar.emit()" title="Close sidebar" aria-label="Close sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Search -->
  <div class="sidebar-search">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      type="text"
      class="search-input"
      placeholder="Search documents..."
      [value]="searchQuery()"
      (input)="onSearch($event)"
    />
  </div>

  <!-- Actions -->
  <div class="sidebar-actions">
    <button class="action-btn primary" (click)="createDocument()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New Page
    </button>
    <div class="action-row">
      <button class="action-btn secondary" (click)="importFiles()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        File
      </button>
      <button class="action-btn secondary" (click)="importFolder()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        Folder
      </button>
    </div>
  </div>

  <!-- Document List -->
  <div class="sidebar-list">
    @for (doc of filteredDocuments; track doc.id) {
      <button
        class="doc-item"
        [class.active]="store.activeId() === doc.id"
        (click)="selectDocument(doc.id)"
      >
        <div class="doc-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <div class="doc-info">
          <span class="doc-title">{{ doc.title || 'Untitled' }}</span>
          <span class="doc-date">{{ doc.updatedAt | timeAgo }}</span>
        </div>
        <button
          class="doc-delete"
          (click)="deleteDocument($event, doc.id)"
          title="Delete"
        >
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </button>
    } @empty {
      <div class="empty-list">
        <p>No documents found</p>
      </div>
    }
  </div>

  <!-- Footer -->
  <div class="sidebar-footer">
    <span class="doc-count">{{ store.documents().length }} documents</span>
  </div>
</aside>
