<button
  type="button"
  class="theme-toggle-btn"
  (click)="onToggle()"
  [attr.aria-label]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
  [title]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
>
  @if (themeService.isDark()) {
    <!-- Sun icon for switching to light -->
    <md-icon name="sun" [size]="16" className="theme-icon sun-icon" />
  } @else {
    <!-- Moon icon for switching to dark -->
    <md-icon name="moon" [size]="16" className="theme-icon moon-icon" />
  }
</button>
