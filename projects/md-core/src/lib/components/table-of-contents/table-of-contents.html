<div class="toc-container">
  <div class="toc-header">
    <div class="toc-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/>
        <line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      <span>Outline</span>
    </div>
    <span class="toc-badge">{{ headings().length }}</span>
  </div>

  <nav class="toc-list">
    @for (heading of headings(); track heading.lineIndex) {
      <a
        href="#"
        class="toc-item level-{{ heading.level }}"
        (click)="onSelect(heading, $event)"
        title="Jump to {{ heading.text }}"
      >
        <span class="toc-indicator">H{{ heading.level }}</span>
        <span class="toc-text">{{ heading.text }}</span>
      </a>
    } @empty {
      <div class="toc-empty">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <p>No headings detected</p>
        <span class="toc-hint">Use #, ##, or ### to create headings</span>
      </div>
    }
  </nav>
</div>
